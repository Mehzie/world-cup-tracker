name: Hourly Live Tracker Update
on:
  schedule:
    - cron: '0 * * * *' # Triggers automatically at the top of every single hour
  workflow_dispatch: # Gives you a manual button to force an instant sync whenever you want

jobs:
  build_and_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly allows editing repo files
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # Uses the built-in system security pass

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Network Libraries
      run: |
        pip install requests

    - name: Execute Tracker Script
      run: python tracker.py

    - name: Commit and Save Live Changes
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add standings.json
        git commit -m "Auto-update: Refreshing third-place tables" || echo "No data modifications detected"
        git push origin main
