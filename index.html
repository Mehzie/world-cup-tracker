<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup 3rd Place Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-4 sm:p-6">
        <header class="text-center my-8">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-amber-400">🏆 World Cup 2026</h1>
            <p class="text-gray-400 mt-2 text-lg">Best 3rd-Placed Teams Live Standings</p>
            <div id="last-updated" class="text-xs text-gray-500 mt-1">Loading...</div>
        </header>

        <div class="bg-gray-800 shadow-xl rounded-xl overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300 text-xs uppercase font-semibold border-b border-gray-600">
                            <th class="p-4 w-12 text-center">Pos</th>
                            <th class="p-4">Team</th>
                            <th class="p-4 text-center">Grp</th>
                            <th class="p-4 text-center">Pld</th>
                            <th class="p-4 text-center">GD</th>
                            <th class="p-4 text-center">GF</th>
                            <th class="p-4 text-center bg-gray-750 font-bold text-amber-400">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-400">Loading standings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-xs text-gray-500">
            <p>🟢 Top 8 teams highlighted green qualify for the Round of 32.</p>
        </footer>
    </div>

    <script>
        // Fetch the data file generated by our Python automated script
        fetch('./standings.json?t=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                document.getElementById('last-updated').innerText = `Last updated: ${data.updated_at}`;
                const tbody = document.getElementById('standings-body');
                tbody.innerHTML = '';

                data.teams.forEach((team, index) => {
                    const rank = index + 1;
                    // Green background accent for top 8, dark gray for bottom 4 eliminated teams
                    const rowClass = rank <= 8 
                        ? 'border-b border-gray-700 hover:bg-emerald-950/30 transition-colors' 
                        : 'border-b border-gray-700 opacity-60 bg-red-950/10 hover:bg-gray-750 transition-colors';
                    
                    const rankBadge = rank <= 8 
                        ? `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-md font-bold">${rank}</span>`
                        : `<span class="bg-red-500/20 text-red-400 px-2 py-0.5 rounded-md font-bold">${rank}</span>`;

                    tbody.innerHTML += `
                        <tr class="${rowClass}">
                            <td class="p-4 text-center">${rankBadge}</td>
                            <td class="p-4 font-medium text-white">${team.name}</td>
                            <td class="p-4 text-center text-gray-400">${team.group}</td>
                            <td class="p-4 text-center">${team.played}</td>
                            <td class="p-4 text-center font-mono ${team.gd > 0 ? 'text-emerald-400' : team.gd < 0 ? 'text-red-400' : ''}">${team.gd > 0 ? '+' + team.gd : team.gd}</td>
                            <td class="p-4 text-center text-gray-300">${team.gf}</td>
                            <td class="p-4 text-center font-bold text-amber-400">${team.points}</td>
                        </tr>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('standings-body').innerHTML = `
                    <tr><td colspan="7" class="p-8 text-center text-red-400">Standings data will display once the script runs for the first time!</td></tr>
                `;
            });
    </script>
</body>
</html>
